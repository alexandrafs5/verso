services:
  postgres:
    image: postgres:16-alpine
    container_name: verso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: verso
      POSTGRES_PASSWORD: verso
      POSTGRES_DB: verso
    ports:
      - "5432:5432"
    volumes:
      - verso-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verso -d verso"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: verso-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  verso-pgdata:
