name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verso
          POSTGRES_PASSWORD: verso
          POSTGRES_DB: verso
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verso -d verso"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://verso:verso@localhost:5432/verso
      DIRECT_DATABASE_URL: postgresql://verso:verso@localhost:5432/verso
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      # The API fails to boot without an email provider. SMTP is never contacted in tests (fake provider).
      SMTP_URL: smtp://localhost:1025
      EMAIL_FROM: Verso <no-reply@verso.local>
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm --filter @verso/api db:deploy

      - name: Test (unit + integration)
        run: pnpm test

      - name: Build
        run: pnpm build
